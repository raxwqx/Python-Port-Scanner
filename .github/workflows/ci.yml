name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} kur
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Testleri çalıştır
        run: python -m pytest

  smoke:
    name: CLI duman testi
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kur ve çalıştır
        run: |
          pip install -e .
          portscan --version
          portscan --list-presets
          portscan -p 22,80 -t 0.1 127.0.0.1
