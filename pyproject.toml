[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-port-scanner"
version = "0.1.0"
description = "Basit Python TCP port tarayıcısı (eğitim amaçlı)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "raxwqx" }]
keywords = ["port-scanner", "security", "networking", "tcp", "cybersecurity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: System :: Networking",
]

[project.scripts]
portscan = "portscan.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["portscan"]
